# ==============================
# Datasource (MySQL)
# ==============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management1?useSSL=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ==============================
# CORS
# ==============================
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*}

# ==============================
# Logging
# ==============================
logging.level.com.hotel=INFO
